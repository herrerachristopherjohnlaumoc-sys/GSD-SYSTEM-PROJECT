<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>General Service Division - Inventory Management System</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

    body {
      background-color: #f0f4f1;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-card {
      background: #ffffff;
      border-radius: 16px;
      padding: 40px 36px 34px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 32px rgba(23, 51, 34, 0.12);
      border: 1px solid #dde8de;
      margin: 20px;
    }

    .login-logo {
      text-align: center;
      margin-bottom: 20px;
    }

    .login-logo-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: #9bc503;
      color: #132215;
      margin-bottom: 14px;
    }

    .login-title {
      font-size: 19px;
      font-weight: 800;
      color: #132215;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 4px;
    }

    .login-subtitle {
      font-size: 12.5px;
      color: #4b6355;
      font-weight: 500;
    }

    .form-section {
      margin-top: 24px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      color: #2c3e33;
      margin-bottom: 6px;
      letter-spacing: 0.3px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 13px;
      color: #6b8070;
      display: flex;
      align-items: center;
      pointer-events: none;
    }

    .form-input {
      width: 100%;
      height: 42px;
      padding: 0 42px 0 40px;
      border: 1px solid #c5d5c9;
      border-radius: 8px;
      font-size: 13.5px;
      color: #1f2d24;
      background: #ffffff;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
      font-family: inherit;
    }

    .form-input::placeholder { color: #8fa898; }

    .form-input:focus {
      border-color: #7da100;
      box-shadow: 0 0 0 3px rgba(155, 197, 3, 0.2);
    }

    .toggle-password {
      position: absolute;
      right: 10px;
      height: 30px;
      width: 30px;
      background: transparent;
      border: none;
      color: #6b8070;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
    }

    .toggle-password:hover { color: #132215; background: #eef4ee; }

    .btn-submit {
      width: 100%;
      height: 44px;
      margin-top: 10px;
      background: #2d6a4f;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      cursor: pointer;
      transition: background-color 0.15s ease;
      font-family: inherit;
    }

    .btn-submit:hover { background: #1f4f39; }

    .card-footer {
      margin-top: 18px;
      text-align: center;
    }

    .forgot-link {
      display: inline-block;
      font-size: 12.5px;
      color: #2d6a4f;
      text-decoration: none;
      font-weight: 600;
      margin-bottom: 14px;
    }

    .forgot-link:hover { text-decoration: underline; }

    .authorized-note {
      font-size: 10px;
      font-weight: 700;
      color: #7a9282;
      letter-spacing: 0.9px;
      text-transform: uppercase;
    }

    textarea.form-input {
      height: auto;
      min-height: 100px;
      padding: 10px 14px;
      resize: vertical;
    }

    /* Security Update Modal */
    .security-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(10, 25, 15, 0.72);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 1500;
    }

    .security-modal-backdrop.open { display: flex; }

    .security-modal-card {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      color: #1e293b;
      border-radius: 14px;
      border: 1px solid #dde8de;
      padding: 28px 26px 24px;
      box-shadow: 0 20px 56px rgba(0,0,0,0.3);
      text-align: center;
    }

    .security-shield-badge {
      width: 56px;
      height: 56px;
      margin: 0 auto 14px;
      border-radius: 999px;
      background: #fef3c7;
      border: 1px solid #fde68a;
      color: #b45309;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .security-modal-title {
      font-size: 19px;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 6px;
    }

    .security-modal-subtitle {
      font-size: 13px;
      color: #64748b;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .security-modal-form { text-align: left; }

    .security-modal-form .form-label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: #334155;
      letter-spacing: 0.45px;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .security-modal-form .form-input {
      width: 100%;
      height: 42px;
      padding: 0 42px 0 38px;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 13px;
      color: #0f172a;
    }

    .security-modal-form .form-input:focus {
      background: #ffffff;
      border-color: #7da100;
      box-shadow: 0 0 0 3px rgba(155, 197, 3, 0.18);
    }

    .security-modal-form .toggle-password { color: #64748b; }
    .security-modal-form .toggle-password:hover { color: #0f172a; background: #e2e8f0; }

    .security-error {
      min-height: 18px;
      margin-bottom: 10px;
      font-size: 12px;
      font-weight: 600;
      color: #b91c1c;
    }

    .security-submit-btn {
      width: 100%;
      height: 44px;
      border: none;
      border-radius: 8px;
      background: #2d6a4f;
      color: #ffffff;
      font-size: 13.5px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      font-family: inherit;
    }

    .security-submit-btn:hover { background: #1f4f39; }

    .security-helper-note {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-top: 14px;
      padding: 10px 12px;
      border-radius: 8px;
      background: #f0f4f1;
      border: 1px solid #dde8de;
      color: #475569;
      font-size: 11.5px;
      line-height: 1.45;
      text-align: left;
    }

    .security-helper-note svg { flex-shrink: 0; margin-top: 1px; color: #64748b; }

    .toast {
      position: fixed;
      bottom: 22px;
      right: 24px;
      background-color: #132215;
      color: #ffffff;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 6px 18px rgba(0,0,0,0.18);
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 999;
    }

    .toast.error { background-color: #b4232a; }
    .toast.show { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body data-page="login">

  <!-- Login Card -->
  <main class="login-card">
    <div class="login-logo">
      <div class="login-logo-badge" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
        </svg>
      </div>
      <div class="login-title">GENERAL SERVICE DIVISION</div>
      <div class="login-subtitle">Inventory Management System</div>
    </div>

    <div id="loginPanel">
      <div class="form-section">
        <form id="loginForm" autocomplete="off">
          <div class="form-group">
            <label for="username" class="form-label">LOGIN</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
                </svg>
              </span>
              <input type="text" id="username" name="username" class="form-input" placeholder="" required />
            </div>
          </div>

          <div class="form-group">
            <label for="password" class="form-label">PASSWORD</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
              </span>
              <input type="password" id="password" name="password" class="form-input" placeholder="" required />
              <button type="button" class="toggle-password" id="togglePassword" data-target="password" aria-label="Toggle password visibility">
                <svg id="eyeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>

          <button type="submit" class="btn-submit">LOG IN</button>
        </form>
      </div>
    </div>

    <form class="form-section" id="resetRequestForm" hidden>
      <div class="form-group">
        <label for="resetUsername" class="form-label">USERNAME</label>
        <div class="input-wrapper">
          <span class="input-icon">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
            </svg>
          </span>
          <input type="text" id="resetUsername" name="username" class="form-input" placeholder="Assigned username" required />
        </div>
      </div>
      <div class="form-group">
        <label for="resetReason" class="form-label">REASON FOR RESET</label>
        <textarea id="resetReason" name="reason" class="form-input" minlength="10" maxlength="1000" rows="4" placeholder="Explain why you need a password reset" required></textarea>
      </div>
      <button type="submit" class="btn-submit">Submit Request</button>
    </form>

    <div class="card-footer">
      <a href="#" class="forgot-link" id="forgotPasswordLink">Forgot Password?</a>
      <p class="authorized-note">AUTHORIZED PERSONNEL OF GSD ONLY</p>
    </div>
  </main>

  <!-- Mandatory Security Update Required Modal (Non-Dismissible) -->
  <div class="security-modal-backdrop" id="forcePasswordModal" role="dialog" aria-modal="true" aria-labelledby="forceModalTitle">
    <div class="security-modal-card">
      <div class="security-shield-badge" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
      </div>
      <h2 class="security-modal-title" id="forceModalTitle">Security Update Required</h2>
      <p class="security-modal-subtitle">You are using a temporary password. Please set a new permanent password to continue.</p>

      <form id="forcePasswordForm" class="security-modal-form" autocomplete="off">
        <div class="form-group">
          <label for="forceCurrentPassword" class="form-label">CURRENT (TEMPORARY) PASSWORD</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input type="password" id="forceCurrentPassword" class="form-input" placeholder="Enter the temporary password" required autocomplete="current-password" />
            <button type="button" class="toggle-password" data-target="forceCurrentPassword" aria-label="Toggle temporary password visibility">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="forceNewPassword" class="form-label">NEW PASSWORD</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input type="password" id="forceNewPassword" class="form-input" minlength="4" maxlength="200" placeholder="At least 4 characters" required autocomplete="new-password" />
            <button type="button" class="toggle-password" data-target="forceNewPassword" aria-label="Toggle new password visibility">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="forceConfirmPassword" class="form-label">CONFIRM NEW PASSWORD</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input type="password" id="forceConfirmPassword" class="form-input" minlength="4" maxlength="200" placeholder="Re-enter new password" required autocomplete="new-password" />
            <button type="button" class="toggle-password" data-target="forceConfirmPassword" aria-label="Toggle confirm password visibility">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <p class="security-error" id="forcePasswordError" role="alert"></p>

        <button type="submit" class="security-submit-btn">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/>
          </svg>
          Set New Password &amp; Continue
        </button>
      </form>

      <div class="security-helper-note">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>
        </svg>
        <span>This dialog cannot be dismissed. A new password must be set to access the system.</span>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="jscript/app.js" defer></script>
</body>
</html>
