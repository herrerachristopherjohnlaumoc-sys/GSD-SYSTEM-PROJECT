<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>General Service Division - Inventory Management System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/nia-theme.css" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body.login-dark-body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top, #1f2937 0%, #0f172a 58%, #090d16 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      color: #f8fafc;
    }

    .bg-decorations {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .bg-decorations .floating-circle {
      position: absolute;
      border-radius: 50%;
      background: rgba(245, 158, 11, 0.08);
      border: 1px solid rgba(245, 158, 11, 0.14);
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(251, 191, 36, 0.45);
    }

    .circle-forklift { width: 140px; height: 140px; top: 12%; left: 22%; }
    .circle-tag { width: 120px; height: 120px; top: 15%; right: 22%; }
    .circle-box { width: 112px; height: 112px; bottom: 15%; left: 24%; }
    .circle-drill { width: 130px; height: 130px; bottom: 12%; right: 23%; }

    .login-card.login-dark-card {
      position: relative;
      z-index: 1;
      background: #111827;
      width: 100%;
      max-width: 440px;
      padding: 40px 36px 34px;
      border-radius: 14px;
      border: 1px solid #263244;
      border-top: 4px solid #f59e0b;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
      text-align: center;
      margin: 20px;
    }

    .login-wrench-badge {
      width: 56px;
      height: 56px;
      margin: 0 auto 16px;
      border-radius: 14px;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(251, 191, 36, 0.4);
      color: #fbbf24;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-dark-card .title {
      font-size: 20px;
      font-weight: 800;
      color: #f8fafc;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .login-dark-card .subtitle {
      font-size: 13px;
      font-weight: 400;
      color: #94a3b8;
      margin-bottom: 28px;
    }

    .login-form {
      text-align: left;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .login-dark-card .form-label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: #cbd5e1;
      letter-spacing: 0.6px;
      margin-bottom: 7px;
      text-transform: uppercase;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 13px;
      color: #94a3b8;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .login-dark-card .form-input {
      width: 100%;
      height: 44px;
      padding: 0 42px 0 40px;
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      font-family: inherit;
      font-size: 13.5px;
      color: #f8fafc;
      outline: none;
      transition: border-color 0.2s, background-color 0.2s, box-shadow 0.2s;
    }

    .login-dark-card .form-input::placeholder {
      color: #64748b;
    }

    .login-dark-card .form-input:focus {
      background-color: #0f172a;
      border-color: #f59e0b;
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.2);
    }

    .login-dark-card textarea.form-input {
      height: auto;
      min-height: 104px;
      padding: 12px 14px;
      resize: vertical;
    }

    .toggle-password {
      position: absolute;
      right: 10px;
      min-height: 30px;
      height: 30px;
      width: 30px;
      background: transparent;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      box-shadow: none;
      transition: color 0.15s, background-color 0.15s;
    }

    .toggle-password:hover {
      color: #f8fafc;
      background-color: rgba(148, 163, 184, 0.15);
      transform: none;
      box-shadow: none;
    }

    .login-dark-card .btn-submit {
      width: 100%;
      height: 44px;
      margin-top: 8px;
      background: #f59e0b;
      color: #111827;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s, box-shadow 0.2s;
    }

    .login-dark-card .btn-submit:hover {
      background: #fbbf24;
      box-shadow: 0 8px 20px rgba(245, 158, 11, 0.28);
    }

    .card-footer {
      margin-top: 22px;
      text-align: center;
    }

    .login-dark-card .forgot-link {
      display: inline-block;
      font-size: 12.5px;
      color: #fbbf24;
      text-decoration: none;
      font-weight: 600;
      margin-bottom: 18px;
    }

    .login-dark-card .forgot-link:hover {
      text-decoration: underline;
      color: #fde68a;
    }

    .authorized-note {
      font-size: 10.5px;
      font-weight: 700;
      color: #64748b;
      letter-spacing: 0.9px;
      text-transform: uppercase;
    }

    /* Mandatory Security Update Modal */
    .security-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(9, 13, 22, 0.82);
      backdrop-filter: blur(5px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 1500;
    }

    .security-modal-backdrop.open {
      display: flex;
    }

    .security-modal-card {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      color: #1e293b;
      border-radius: 14px;
      border: 1px solid #e2e8f0;
      padding: 28px 26px 24px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.45);
      text-align: center;
    }

    .security-shield-badge {
      width: 56px;
      height: 56px;
      margin: 0 auto 14px;
      border-radius: 999px;
      background: #fef3c7;
      border: 1px solid #fde68a;
      color: #b45309;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .security-modal-title {
      font-size: 20px;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 6px;
    }

    .security-modal-subtitle {
      font-size: 13px;
      color: #64748b;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .security-modal-form {
      text-align: left;
    }

    .security-modal-form .form-label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: #334155;
      letter-spacing: 0.45px;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .security-modal-form .form-input {
      width: 100%;
      height: 42px;
      padding: 0 42px 0 38px;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 13px;
      color: #0f172a;
    }

    .security-modal-form .form-input:focus {
      background: #ffffff;
      border-color: #d97706;
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.18);
    }

    .security-modal-form .toggle-password {
      color: #64748b;
    }

    .security-modal-form .toggle-password:hover {
      color: #0f172a;
      background: #e2e8f0;
    }

    .security-error {
      min-height: 18px;
      margin-bottom: 10px;
      font-size: 12px;
      font-weight: 600;
      color: #b91c1c;
    }

    .security-submit-btn {
      width: 100%;
      height: 44px;
      border: none;
      border-radius: 8px;
      background: #d97706;
      color: #ffffff;
      font-size: 13.5px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
    }

    .security-submit-btn:hover {
      background: #b45309;
    }

    .security-helper-note {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-top: 14px;
      padding: 10px 12px;
      border-radius: 8px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      color: #475569;
      font-size: 11.5px;
      line-height: 1.45;
      text-align: left;
    }

    .security-helper-note svg {
      flex-shrink: 0;
      margin-top: 1px;
      color: #64748b;
    }

    @media (max-width: 1100px) {
      .circle-forklift { left: 8%; }
      .circle-tag { right: 8%; }
      .circle-box { left: 10%; }
      .circle-drill { right: 10%; }
    }

    @media (max-width: 640px) {
      .login-card.login-dark-card { padding: 34px 22px 28px; }
      .floating-circle { transform: scale(0.75); }
      .circle-forklift { top: 4%; left: 4%; }
      .circle-tag { top: 5%; right: 4%; }
      .circle-box { bottom: 5%; left: 5%; }
      .circle-drill { bottom: 4%; right: 5%; }
    }
  </style>
</head>
<body class="login-dark-body">

  <!-- Decorative Background Icons -->
  <div class="bg-decorations" aria-hidden="true">
    <div class="floating-circle circle-forklift">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 12H5a2 2 0 0 0-2 2v3h2"/>
        <path d="M9 17h5"/>
        <circle cx="7" cy="17" r="2"/>
        <circle cx="16" cy="17" r="2"/>
        <path d="M12 12V7a1 1 0 0 0-1-1H7a1 1 0 0 0-1 1v5"/>
        <path d="M19 4v13h3"/>
      </svg>
    </div>

    <div class="floating-circle circle-tag">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"/>
        <circle cx="7.5" cy="7.5" r=".5" fill="currentColor"/>
      </svg>
    </div>

    <div class="floating-circle circle-box">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
        <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
        <line x1="12" y1="22.08" x2="12" y2="12"/>
      </svg>
    </div>

    <div class="floating-circle circle-drill">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 9c0 .6-.4 1-1 1H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9c.6 0 1 .4 1 1Z"/>
        <path d="M18 6h4"/>
        <path d="M14 4h3a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1h-3"/>
        <path d="m5 10-2 8"/>
        <path d="M12 10v3c0 .6-.4 1-1 1H8"/>
        <path d="m7 18 2-8"/>
        <path d="M5 22c-1.7 0-3-1.3-3-3 0-.6.4-1 1-1h7c.6 0 1 .4 1 1v2c0 .6-.4 1-1 1Z"/>
      </svg>
    </div>
  </div>

  <!-- Center Login Card -->
  <main class="login-card login-dark-card">
    <div class="login-wrench-badge" aria-hidden="true">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
      </svg>
    </div>

    <h1 class="title">GENERAL SERVICE DIVISION</h1>
    <p class="subtitle">Inventory Management System</p>

    <div id="loginPanel">
      <form class="login-form" id="loginForm">
        <div class="form-group">
          <label for="username" class="form-label">USERNAME</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
            </span>
            <input type="text" id="username" name="username" class="form-input" placeholder="Enter your username" required />
          </div>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">PASSWORD</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input type="password" id="password" name="password" class="form-input" placeholder="Enter password" required />
            <button type="button" class="toggle-password" id="togglePassword" data-target="password" aria-label="Toggle password visibility">
              <svg id="eyeIcon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-submit">Sign In</button>
      </form>
    </div>

    <form class="login-form" id="resetRequestForm" hidden>
      <div class="form-group">
        <label for="resetUsername" class="form-label">USERNAME</label>
        <div class="input-wrapper">
          <span class="input-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
          </span>
          <input type="text" id="resetUsername" name="username" class="form-input" placeholder="Assigned username" required />
        </div>
      </div>
      <div class="form-group">
        <label for="resetReason" class="form-label">REASON FOR RESET</label>
        <textarea id="resetReason" name="reason" class="form-input" minlength="10" maxlength="1000" rows="4" placeholder="Explain why you need a password reset" required></textarea>
      </div>
      <button type="submit" class="btn-submit">Submit Request</button>
    </form>

    <div class="card-footer">
      <a href="#" class="forgot-link" id="forgotPasswordLink">Forgot Password?</a>
      <p class="authorized-note">AUTHORIZED PERSONNEL ONLY</p>
    </div>
  </main>

  <!-- Mandatory Security Update Required Modal (Non-Dismissible) -->
  <div class="security-modal-backdrop" id="forcePasswordModal" role="dialog" aria-modal="true" aria-labelledby="forceModalTitle">
    <div class="security-modal-card">
      <div class="security-shield-badge" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
      </div>
      <h2 class="security-modal-title" id="forceModalTitle">Security Update Required</h2>
      <p class="security-modal-subtitle">You are using a temporary password. Please set a new permanent password to continue.</p>

      <form id="forcePasswordForm" class="security-modal-form" autocomplete="off">
        <div class="form-group">
          <label for="forceCurrentPassword" class="form-label">CURRENT (TEMPORARY) PASSWORD</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input type="password" id="forceCurrentPassword" class="form-input" placeholder="Enter the temporary password" required autocomplete="current-password" />
            <button type="button" class="toggle-password" data-target="forceCurrentPassword" aria-label="Toggle temporary password visibility">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="forceNewPassword" class="form-label">NEW PASSWORD</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input type="password" id="forceNewPassword" class="form-input" minlength="4" maxlength="200" placeholder="At least 4 characters" required autocomplete="new-password" />
            <button type="button" class="toggle-password" data-target="forceNewPassword" aria-label="Toggle new password visibility">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="forceConfirmPassword" class="form-label">CONFIRM NEW PASSWORD</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input type="password" id="forceConfirmPassword" class="form-input" minlength="4" maxlength="200" placeholder="Re-enter new password" required autocomplete="new-password" />
            <button type="button" class="toggle-password" data-target="forceConfirmPassword" aria-label="Toggle confirm password visibility">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <p class="security-error" id="forcePasswordError" role="alert"></p>

        <button type="submit" class="security-submit-btn">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <path d="m9 12 2 2 4-4"/>
          </svg>
          Set New Password &amp; Continue
        </button>
      </form>

      <div class="security-helper-note">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="16" x2="12" y2="12"/>
          <line x1="12" y1="8" x2="12.01" y2="8"/>
        </svg>
        <span>This dialog cannot be dismissed. A new password must be set to access the system.</span>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="jscript/app.js" defer></script>
</body>
</html>
