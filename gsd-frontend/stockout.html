<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stock-Out — General Service Division</title>
  <style>
    /* =========================================
       RESET & BASE STYLES
       ========================================= */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f4f6f4;
      color: #1f2d24;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* =========================================
       TOP HEADER BAR
       ========================================= */
    .topbar {
      background-color: #9bc503;
      height: 54px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #132215;
      flex-shrink: 0;
    }

    .topbar-title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }

    .user-info {
      text-align: right;
      line-height: 1.2;
    }

    .user-name {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: #132215;
    }

    .user-role {
      font-size: 9.5px;
      font-weight: 600;
      text-transform: uppercase;
      color: #2f4518;
    }

    /* =========================================
       MAIN LAYOUT WRAPPER
       ========================================= */
    .layout-container {
      display: flex;
      flex: 1;
    }

    /* =========================================
       SIDEBAR NAVIGATION
       ========================================= */
    .sidebar {
      width: 220px;
      background-color: #9bc503;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 18px 14px;
      flex-shrink: 0;
    }

    .nav-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .nav-item a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 14px;
      border-radius: 8px;
      text-decoration: none;
      color: #162418;
      font-size: 13.5px;
      font-weight: 600;
      transition: background-color 0.15s ease;
    }

    .nav-item a:hover {
      background-color: rgba(255, 255, 255, 0.35);
    }

    .nav-item.active a {
      background-color: #ffffff;
      color: #162418;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    }

    .nav-icon {
      width: 17px;
      height: 17px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.9;
      flex-shrink: 0;
    }

    .logout-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 11px;
      background-color: #ff4757;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      text-transform: uppercase;
      transition: background-color 0.15s ease;
    }

    .logout-btn:hover {
      background-color: #e83e4d;
    }

    /* =========================================
       MAIN CONTENT AREA & CARDS
       ========================================= */
    .main-content {
      flex: 1;
      padding: 26px 28px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      align-items: start;
    }

    .card {
      background-color: #ffffff;
      border-radius: 16px;
      padding: 26px 28px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
      border: 1px solid #ebeeec;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .card-title-group {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #173322;
    }

    .card-title-group svg {
      width: 20px;
      height: 20px;
      stroke: #173322;
      fill: none;
      stroke-width: 1.9;
    }

    .card-title {
      font-size: 16.5px;
      font-weight: 700;
      color: #173322;
    }

    /* =========================================
       FORM ELEMENTS
       ========================================= */
    .form-group {
      margin-bottom: 14px;
    }

    .label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .form-label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: #2c3e33;
      letter-spacing: 0.3px;
    }

    .stock-hint {
      font-size: 11px;
      font-weight: 600;
      color: #5b7800;
    }

    .stock-hint.error {
      color: #d63031;
    }

    .pill-input {
      width: 100%;
      height: 38px;
      padding: 0 16px;
      border: 1px solid #3c4841;
      border-radius: 999px;
      font-size: 13px;
      color: #1f2d24;
      background-color: #ffffff;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .pill-input::placeholder {
      color: #88928c;
    }

    .pill-input:focus {
      border-color: #7da100;
      box-shadow: 0 0 0 3px rgba(155, 197, 3, 0.22);
    }

    .pill-input[readonly] {
      background-color: #fafbfa;
      color: #1f2d24;
      font-weight: 600;
    }

    /* =========================================
       BUTTONS
       ========================================= */
    .form-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 22px;
    }

    .pill-btn {
      height: 38px;
      border-radius: 999px;
      border: 1px solid #2b3830;
      background-color: #ffffff;
      color: #173322;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .pill-btn:hover {
      background-color: #f0f4f1;
    }

    .pill-btn.primary:hover {
      background-color: #9bc503;
      border-color: #8ab002;
      color: #132215;
    }

    .pill-btn-sm {
      padding: 6px 18px;
      border-radius: 999px;
      border: 1px solid #2b3830;
      background-color: #ffffff;
      color: #173322;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    .pill-btn-sm:hover {
      background-color: #f0f4f1;
    }

    /* =========================================
       RECENT STOCK-OUT DISPLAY
       ========================================= */
    .recent-so-details {
      font-size: 13px;
      color: #243329;
      line-height: 1.75;
    }

    .recent-so-ref {
      margin-bottom: 2px;
    }

    .recent-so-ref strong {
      font-weight: 700;
      color: #132215;
    }

    .recent-so-product {
      font-size: 14px;
      font-weight: 700;
      color: #132215;
      margin-bottom: 8px;
    }

    .recent-so-meta {
      margin-top: 12px;
    }

    .empty-state {
      color: #7c8780;
      font-size: 13px;
      font-style: italic;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 22px;
      right: 24px;
      background-color: #173322;
      color: #ffffff;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18);
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 999;
    }

    .toast.error {
      background-color: #c0392b;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 960px) {
      .main-content {
        grid-template-columns: 1fr;
      }
      .sidebar {
        width: 190px;
      }
    }
  </style>
  <link rel="stylesheet" href="css/nia-theme.css" />
</head>
<body data-page="stockout">

  <!-- TOP BAR -->
  <header class="topbar">
    <div class="topbar-title">GENERAL SERVICE DIVISION</div>
    <div class="user-info">
      <div class="user-name" id="headerUserName">-</div>
      <div class="user-role" id="headerUserRole">-</div>
    </div>
  </header>

  <!-- BODY WRAPPER -->
  <div class="layout-container">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <ul class="nav-list">
        <li class="nav-item">
          <a href="inventory.html">
            <svg class="nav-icon" viewBox="0 0 24 24">
              <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
              <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
              <line x1="12" y1="22.08" x2="12" y2="12"></line>
            </svg>
            <span>Inventory</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="purchaseorder.html">
            <svg class="nav-icon" viewBox="0 0 24 24">
              <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <path d="M16 10a4 4 0 0 1-8 0"></path>
            </svg>
            <span>Purchase Order</span>
          </a>
        </li>
        <li class="nav-item active">
          <a href="stockout.html">
            <svg class="nav-icon" viewBox="0 0 24 24">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
            <span>Stock-Out</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="stockcard.html">
            <svg class="nav-icon" viewBox="0 0 24 24">
              <rect x="3" y="4" width="18" height="16" rx="2"></rect>
              <line x1="7" y1="8" x2="17" y2="8"></line>
              <line x1="7" y1="12" x2="17" y2="12"></line>
              <line x1="7" y1="16" x2="13" y2="16"></line>
            </svg>
            <span>Stock Card</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="returnslip.html">
            <svg class="nav-icon" viewBox="0 0 24 24">
              <polyline points="9 14 4 9 9 4"></polyline>
              <path d="M20 20v-7a4 4 0 0 0-4-4H4"></path>
            </svg>
            <span>Return Slip</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="settings.html">
            <svg class="nav-icon" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
            <span>Settings</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="usermanagement.html">
            <svg class="nav-icon" viewBox="0 0 24 24">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
              <circle cx="9" cy="7" r="4"></circle>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
            <span>User Management</span>
          </a>
        </li>
      </ul>

      <button type="button" class="logout-btn" id="logoutBtn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        LOGOUT
      </button>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">

      <!-- LEFT CARD: NEW STOCK-OUT (SRF) FORM -->
      <section class="card">
        <div class="card-header">
          <div class="card-title-group">
            <svg viewBox="0 0 24 24">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
            <h2 class="card-title">New Stock-Out (SRF)</h2>
          </div>
        </div>

        <form id="stockOutForm" autocomplete="off">
          <div class="form-group">
            <label class="form-label" for="txnDateInput">DATE ISSUED</label>
            <input type="date" id="txnDateInput" class="pill-input" required />
          </div>

          <div class="form-group">
            <div class="label-row">
              <label class="form-label" for="srfReferenceInput">SRF REFERENCE NUMBER</label>
            </div>
            <input
              type="text"
              id="srfReferenceInput"
              class="pill-input"
              placeholder="e.g. SRF # 817"
              required
            />
          </div>

          <div class="form-group">
            <div class="label-row">
              <label class="form-label" for="productDeductInput">PRODUCT TO DEDUCT</label>
              <span class="stock-hint" id="availableStockHint"></span>
            </div>
            <input
              type="text"
              id="productDeductInput"
              class="pill-input"
              list="inventoryProductList"
              placeholder="Search inventory..."
              required
            />
            <datalist id="inventoryProductList"></datalist>
          </div>

          <div class="form-group">
            <div class="label-row">
              <label class="form-label" for="officeInput">REQUESTING OFFICE / DEPARTMENT</label>
            </div>
            <input
              type="text"
              id="officeInput"
              class="pill-input"
              list="officeSuggestions"
              placeholder="e.g. OCBS"
              required
            />
            <datalist id="officeSuggestions">
              <option value="OCBS"></option>
              <option value="GSD"></option>
              <option value="ADMIN"></option>
              <option value="ACCOUNTING"></option>
              <option value="REGISTRAR"></option>
              <option value="HRMO"></option>
            </datalist>
          </div>

          <div class="form-group">
            <div class="label-row">
              <label class="form-label" for="unitInput">UNIT</label>
            </div>
            <input
              type="text"
              id="unitInput"
              class="pill-input"
              list="unitSuggestions"
              placeholder="e.g. ROLLS, PCS, BAGS"
              required
            />
            <datalist id="unitSuggestions">
              <option value="ROLLS"></option>
              <option value="PCS"></option>
              <option value="BAGS"></option>
              <option value="BOX"></option>
              <option value="SET"></option>
              <option value="GALLON"></option>
              <option value="METER"></option>
            </datalist>
          </div>

          <div class="form-group">
            <div class="label-row">
              <label class="form-label" for="quantityDeductInput">QUANTITY TO DEDUCT</label>
            </div>
            <input
              type="number"
              id="quantityDeductInput"
              class="pill-input"
              min="1"
              step="1"
              placeholder="Enter quantity"
              required
            />
          </div>

          <div class="form-group">
            <div class="label-row">
              <label class="form-label" for="unitCostInput">UNIT COST (PER PIECE)</label>
            </div>
            <input
              type="number"
              id="unitCostInput"
              class="pill-input"
              min="0"
              step="0.01"
              placeholder="Enter unit cost"
              required
            />
          </div>

          <div class="form-group">
            <div class="label-row">
              <label class="form-label" for="totalBalanceValueInput">TOTAL BALANCE VALUE</label>
            </div>
            <input
              type="text"
              id="totalBalanceValueInput"
              class="pill-input"
              placeholder="Auto-calculated total value"
              readonly
            />
          </div>

          <div class="form-actions">
            <button type="submit" class="pill-btn primary">Deduct from Inventory</button>
            <button type="button" class="pill-btn" id="clearFormBtn">Clear Form</button>
          </div>
        </form>
      </section>

      <!-- RIGHT CARD: RECENT STOCK-OUTS -->
      <section class="card">
        <div class="card-header">
          <div class="card-title-group">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="9"></circle>
              <polyline points="12 7 12 12 15 14"></polyline>
            </svg>
            <h2 class="card-title">Recent Stock-Outs</h2>
          </div>
          <button type="button" class="pill-btn-sm" id="clearRecentBtn">Clear View</button>
        </div>

        <div id="recentStockOutContainer" class="recent-so-details recent-scroll-list">
          <!-- Populated dynamically by JavaScript -->
        </div>
      </section>

    </main>
  </div>

  <!-- TOAST FEEDBACK -->
  <div id="toast" class="toast"></div>
  <script src="jscript/app.js" defer></script>
</body>
</html>
